<!DOCTYPE html>
<html lang="ja" spellcheck="false">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' https: blob:; frame-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' data: blob:; form-action 'self' https://script.google.com">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meldex Memo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Meldex Quick Memo</title>
  <link rel="manifest" href="quick-memo.webmanifest">
  <link rel="apple-touch-icon" href="MeldexQuickMemo_icon_256.png">
  <link rel="stylesheet" href="gb-fonts.css">
  <link rel="stylesheet" href="gb-shortcut-registry.css">
  <link rel="stylesheet" href="gb-icon-assets.css">
  <link rel="stylesheet" href="gb-theme.css">
  <link rel="stylesheet" href="gb-ui.css">
  <link rel="stylesheet" href="standalone-shell.css">
  <link rel="stylesheet" href="standalone-workspace-tree.css">
  <link rel="stylesheet" href="quick-memo.css">
  <link rel="stylesheet" href="standalone-tags.css">
  <link rel="stylesheet" href="standalone-profile.css">
  <link rel="stylesheet" href="gb-tooltip.css">
  <link rel="stylesheet" href="standalone-secondary-panel.css">
</head>
<body data-standalone-profile-local="true">
  <main class="qm-shell" id="editorView">
    <header class="qm-header sa-toolbar">
      <div class="qm-menu-wrap">
        <button id="menuBtn" class="qm-icon" type="button" title="メニュー" aria-label="メニュー" aria-expanded="false"><span class="ico ico-menu"></span></button>
        <div id="quickMemoMenu" class="qm-menu" role="menu" hidden>
          <button id="newMemoBtn" type="button"><span class="ico ico-filePlus"></span>新規メモ</button>
          <button id="saveBtn" type="button"><span class="ico ico-save"></span>端末へ保存</button>
          <button id="menuListBtn" type="button"><span class="ico ico-history"></span>過去のメモ</button>
          <button id="workspaceBtn" type="button" data-cloud-workspace><span class="ico ico-folderOpen"></span>Meldexファイル</button>
          <div class="qm-menu-sep"></div>
          <button id="installBtn" type="button"><span class="ico ico-download"></span>ホームに追加</button>
          <div id="cloudConnectBanner" class="qm-cloud-connect" style="display:none;">
            <button id="cloudConnectBtn" type="button"><span class="ico ico-cloud"></span>Dropboxに接続</button>
            <div class="qm-cloud-connect-code">
              <input id="cloudConnectCode" type="text" placeholder="接続コード" aria-label="Dropboxの接続コード" spellcheck="false" autocomplete="off">
              <button id="cloudConnectSubmitBtn" type="button">接続</button>
            </div>
          </div>
        </div>
      </div>
      <div class="qm-brand">
        <img src="MeldexQuickMemo_icon_64.png" alt="" width="24" height="24">
        <div class="qm-title-stack">
          <input id="titleInput" class="qm-title-input" type="text" placeholder="タイトル（空なら本文の一行目）" aria-label="メモのタイトル" spellcheck="false">
          <span id="syncStatus" role="status" aria-live="polite">端末に保存済み</span>
        </div>
      </div>
      <div class="qm-header-actions">
        <button id="listBtn" class="qm-icon" type="button" title="過去のメモ" aria-label="過去のメモ"><span class="ico ico-history"></span></button>
        <span class="qm-profile-slot" data-sa-profile-slot></span>
      </div>
    </header>

    <section id="tagSelector" class="qm-tag-selector" aria-label="タグ">
      <span class="qm-tag-label"><span class="ico ico-tags"></span>タグ</span>
      <div id="tagChips" class="qm-tag-chips"></div>
      <button id="addTagBtn" class="qm-tag-add" type="button" title="タグを追加" aria-label="タグを追加"><span class="ico ico-plus"></span></button>
    </section>

    <nav class="qm-mode-controls" aria-label="入力方法と履歴">
      <select id="modeSelect" aria-label="入力方法">
        <option value="text">テキスト</option>
        <option value="pen">ペン</option>
        <option value="voice">音声</option>
      </select>
      <div class="qm-toolbar-group" data-for="pen" style="display:none;">
        <button id="colorSwatchBtn" class="qm-color-swatch" type="button" title="色と不透明度" aria-label="色と不透明度"></button>
        <div id="colorPopover" class="qm-color-popover" hidden>
          <label>色<input id="colorInput" type="color" value="#4ec9b0"></label>
          <label>不透明度
            <span><input id="opacityInput" type="range" min="1" max="100" value="100"><output id="opacityValue">100%</output></span>
          </label>
        </div>
        <label class="qm-width-control" title="線幅"><span>線幅</span><input id="widthInput" type="range" min="2" max="24" value="4"></label>
        <button id="penBtn" class="qm-icon qm-lucide-button is-active" type="button" title="ペン" aria-label="ペン"></button>
        <button id="fillBtn" class="qm-icon qm-lucide-button" type="button" title="閉じた領域を塗る" aria-label="塗り"></button>
        <button id="eraserBtn" class="qm-icon qm-lucide-button" type="button" title="消しゴム" aria-label="消しゴム"></button>
        <button id="clearDrawingBtn" class="qm-icon qm-lucide-button" type="button" title="描画を消去" aria-label="消去"></button>
      </div>
      <div class="qm-toolbar-group" data-for="voice" style="display:none;">
        <button id="voiceRecordBtn" class="qm-icon qm-lucide-button" type="button" title="録音開始" aria-label="録音開始"></button>
        <button id="voicePauseBtn" class="qm-icon qm-lucide-button" type="button" title="一時停止" aria-label="一時停止" style="display:none;"></button>
        <button id="voiceResumeBtn" class="qm-icon qm-lucide-button" type="button" title="録音再開" aria-label="録音再開" style="display:none;"></button>
        <button id="voiceStopBtn" class="qm-icon qm-lucide-button" type="button" title="録音終了" aria-label="録音終了" style="display:none;"></button>
      </div>
      <span class="qm-mode-spacer"></span>
      <button id="undoBtn" class="qm-icon qm-lucide-button" type="button" title="元に戻す" aria-label="元に戻す" disabled></button>
      <button id="redoBtn" class="qm-icon qm-lucide-button" type="button" title="やり直す" aria-label="やり直す" disabled></button>
    </nav>

    <section class="qm-surface">
      <div id="editor" class="qm-editor" contenteditable="true" spellcheck="false" role="textbox" aria-label="メモ本文" data-placeholder="すぐ書けます"></div>
      <canvas id="drawingCanvas" class="qm-canvas" aria-label="手書きメモ" style="display:none;"></canvas>
      <div id="voicePanel" class="qm-voice" style="display:none;">
        <div class="qm-voice-status" id="voiceStatus">マイクの準備ができています</div>
        <div class="qm-voice-timer" id="voiceTimer">00:00</div>
        <div id="voiceTranscript" class="qm-voice-transcript"></div>
      </div>
    </section>
  </main>

  <section id="listView" class="qm-shell qm-list-view" style="display:none;">
    <header class="qm-header">
      <div class="qm-brand">
        <img src="MeldexQuickMemo_icon_64.png" alt="" width="24" height="24">
        <div><strong>クイックメモ一覧</strong></div>
      </div>
      <div class="qm-header-actions">
        <button id="listBackBtn" class="qm-icon" type="button" title="戻る" aria-label="戻る"><span class="ico ico-x"></span></button>
      </div>
    </header>
    <section class="qm-list-filter">
      <input id="listSearch" type="text" placeholder="検索" spellcheck="false">
      <select id="listTagFilter"><option value="">すべてのタグ</option></select>
    </section>
    <section id="listContent" class="qm-list-content"></section>
    <button id="listMoreBtn" class="qm-list-more" type="button" hidden>さらに表示</button>
  </section>

  <div id="standalone-toast" class="sa-toast" role="status" aria-live="polite"></div>

  <script src="gb-split-loader.js"></script>
  <script src="vendor/lucide-icons.js"></script>
  <script src="meldex-core.js"></script>
  <script src="standalone-profile.js"></script>
  <script src="gb-auto-tag-settings.js"></script>
  <script src="gb-global-tags.js"></script>
  <script src="gb-tag-preset-management.js"></script>
<script src="gb-tag-panel-tabs.js"></script><script src="gb-tag-tree-runtime.js"></script><script src="gb-tag-management-overlays.js"></script><script src="gb-tag-catalog-suggestions.js"></script>
  <script src="gb-tag-display-preferences.js"></script>
  <script src="gb-tag-group-summary.js"></script>
  <script src="gb-tag-tree-dnd.js"></script>
  <script src="gb-tag-management.js"></script>
  <script src="standalone-tags.js"></script>
  <script src="standalone-workspace-tree.js"></script>
  <script src="standalone-pwa-install.js"></script>
  <script src="standalone-app-bootstrap.js"></script>
  <script src="standalone-local-drafts.js"></script>
  <script src="standalone-offline-outbox.js"></script>
  <script src="gb-tooltip.js"></script>
  <script src="gb-dialog-keyboard.js"></script>
  <script src="gb-shortcut-registry.js"></script>
  <script src="standalone-secondary-panel.js"></script>
  <script src="standalone-close-guard.js"></script>
  <script src="standalone-save-queue.js"></script>
  <script src="quick-memo-editor.js"></script>
  <script src="quick-memo-drawing.js"></script>
  <script src="quick-memo-library.js"></script>
  <script src="gb-cloud-frontmatter-lite.js"></script>
  <script src="standalone-always-on-top.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Meldex本体のフロートパネルへ埋め込まれている場合は、自分のウィンドウを
      // 持たないため「常に最前面」を出さない（本体のウィンドウを操作してしまう）。
      var embedded = false;
      try { embedded = window.top !== window.self; } catch (e) { embedded = true; }
      if (!embedded) {
        embedded = new URLSearchParams(location.search).get("embed") === "1";
      }
      if (embedded) {
        document.body.dataset.quickMemoEmbed = "1";
        return;
      }
      window.MeldexAlwaysOnTop?.install({
        appId: "quick-memo",
        host: document.querySelector("#editorView .qm-header-actions"),
        buttonClass: "qm-icon",
      });
    });
  </script>
  <script src="quick-memo.js"></script>
  <!-- 共通カラーパレット（ビューワー残課題修正計画 2026-08-04「4. 共通カラーパレット」）。
       quick-memo-drawing.js は本タスクの編集対象外のため、色スウォッチボタンのクリック挙動を
       クローン置換で差し替えて共通パレット(openColorPalette)を開くよう配線する（下記スクリプト）。 -->
  <script src="gb-color-palette.js"></script>
  <script>
  (function () {
    'use strict';
    // colorInput.value が既存コード全体（quick-memo-drawing.js）の唯一の真値なので、
    // 選択色はそこへ書き戻し、既存のinputリスナー（スウォッチ表示・設定保存）をそのまま動かす。
    window.addEventListener('load', function () {
      var swatchBtn = document.getElementById('colorSwatchBtn');
      var colorInput = document.getElementById('colorInput');
      var popover = document.getElementById('colorPopover');
      if (!swatchBtn || !colorInput || typeof openColorPalette !== 'function') return;
      // 既存のポップオーバートグル用リスナー（quick-memo-drawing.js）を完全に外すため、
      // ボタンをクローン置換してから独自ハンドラだけを付け直す。
      var freshBtn = swatchBtn.cloneNode(true);
      swatchBtn.replaceWith(freshBtn);
      freshBtn.addEventListener('click', function () {
        if (popover) popover.hidden = true;
        openColorPalette(freshBtn, colorInput.value, function (color) {
          if (!color || color === 'transparent') return;
          colorInput.value = color;
          colorInput.dispatchEvent(new Event('input', { bubbles: true }));
        });
      });
    });
  })();
  </script>
</body>
</html>
