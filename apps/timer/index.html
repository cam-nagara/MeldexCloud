<body>
  <div class="sa-shell sa-options-collapsed timer-app">
    <header class="sa-toolbar">
      <div class="sa-menu-wrap">
        <button id="timer-menu-button" class="sa-icon-btn" type="button" title="メニュー" aria-label="メニュー"><span class="ico ico-menu"></span></button>
        <div id="timer-menu" class="sa-menu" role="menu">
          <button type="button" data-timer-file-action="new"><span class="ico ico-filePlus"></span>新規タイマー</button>
          <button type="button" data-timer-file-action="open"><span class="ico ico-folderOpen"></span>開く...</button>
          <button type="button" data-timer-file-action="save"><span class="ico ico-save"></span>保存</button>
          <button type="button" data-timer-file-action="saveAs"><span class="ico ico-saveAll"></span>名前を付けて保存...</button>
          <button type="button" data-timer-file-action="workspace" data-cloud-workspace><span class="ico ico-folderOpen"></span>Meldexファイル</button>
          <div class="sa-menu-sep"></div>
          <button type="button" data-standalone-default-apps-open><span class="ico ico-fileCog"></span>既定アプリに設定...</button>
        </div>
      </div>
      <input id="timer-title-label" class="sa-title sa-title-input" type="text" value="タイマー" aria-label="タイマー名" spellcheck="false">
      <div id="timer-sync-status" class="sa-sync-status" aria-live="polite"></div>
      <div id="timer-path-label" class="sa-path">未保存</div>
      <button id="timer-option-panel-button" class="sa-icon-btn" type="button" title="オプションを開く" aria-label="オプションを開く" aria-pressed="false" data-gb-tooltip-key="panel.right.toggle" data-e2e-id="timer-option-panel-button"><span class="ico ico-panelRight"></span></button>
    </header>
    <div class="sa-body">
      <main id="timer-root" class="sa-main timer-main"></main>
      <div id="timer-option-resizer" class="sa-option-resizer" role="separator" aria-label="オプションパネルの幅を調整" aria-orientation="vertical" tabindex="0"></div>
      <aside id="timer-option-panel" class="sa-option-panel" aria-label="オプションパネル">
        <div class="sa-option-header"><span>オプション</span></div>
        <div id="rp-detail" class="sa-option-body"></div>
      </aside>
    </div>
  </div>
  <div id="standalone-loading" class="sa-loading" role="status" aria-live="polite" aria-busy="true">
    <div class="sa-loading-box">
      <div class="sa-spinner" aria-hidden="true"></div>
      <div id="standalone-loading-text">読み込んでいます...</div>
    </div>
  </div>
  <div id="standalone-toast" class="sa-toast" role="status" aria-live="polite"></div>

    // 「常に最前面」は Windows デスクトップ版だけで有効。非対応環境ではボタンを出さない。
    document.addEventListener("DOMContentLoaded", () => {
      const before = document.getElementById("timer-option-panel-button");
      window.MeldexAlwaysOnTop?.install({
        appId: "timer",
        host: before?.parentElement,
        buttonClass: "sa-icon-btn",
        before,

    });
