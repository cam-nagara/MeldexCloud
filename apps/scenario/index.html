    <header class="sa-toolbar">
      <div class="sa-menu-wrap">
        <button id="scenario-menu-button" class="sa-icon-btn" type="button" title="メニュー" aria-label="メニュー"><span class="ico ico-menu"></span></button>
        <div id="scenario-menu" class="sa-menu" role="menu">
          <button type="button" data-scenario-action="new"><span class="ico ico-filePlus"></span>新規シナリオ</button>
          <button type="button" data-scenario-action="open"><span class="ico ico-folderOpen"></span>開く...</button>
          <button type="button" data-scenario-action="save"><span class="ico ico-save"></span>保存</button>
          <button type="button" data-scenario-action="saveAs"><span class="ico ico-saveAll"></span>名前を付けて保存...</button>
          <div class="sa-menu-sep"></div>
          <button type="button" data-scenario-action="exportPng"><span class="ico ico-image"></span>画像（PNG）として保存...</button>
          <button type="button" data-scenario-action="exportHtml"><span class="ico ico-fileCode"></span>HTMLとして保存...</button>
          <button type="button" data-scenario-action="exportMarkdown"><span class="ico ico-fileText"></span>Markdownとして保存...</button>
          <div class="sa-menu-sep"></div>
          <button type="button" data-scenario-action="clipstudio" id="scenario-menu-clipstudio"><span class="ico ico-clipboardCopy"></span>CLIP STUDIO PAINTへ送信</button>
          <button type="button" data-scenario-action="sendBmanga"><span class="ico ico-upload"></span>B-MANGAへ送信...</button>
          <div class="sa-menu-sep"></div>
          <button type="button" data-scenario-action="undo"><span class="ico ico-undo2"></span>元に戻す</button>
          <button type="button" data-scenario-action="redo"><span class="ico ico-redo2"></span>やり直し</button>
          <div class="sa-menu-sep"></div>
          <button type="button" data-standalone-default-apps-open><span class="ico ico-fileCog"></span>既定アプリに設定...</button>
        </div>
      </div>
      <div id="scenario-title-label" class="sa-title">新規シナリオ</div>
      <div id="scenario-path-label" class="sa-path">未保存</div>
      <button id="scenario-option-panel-button" class="sa-icon-btn" type="button" title="オプションを開く" aria-label="オプションを開く" aria-pressed="false" data-e2e-id="scenario-option-panel-button"><span class="ico ico-slidersHorizontal"></span></button>
    </header>
    <div class="sa-body">

      <aside id="scenario-option-panel" class="sa-option-panel" aria-label="オプションパネル">
        <div class="sa-option-header"><span>オプション</span></div>
        <div id="rp-detail" class="sa-option-body"></div>
      </aside>
    </div>
  </div>
