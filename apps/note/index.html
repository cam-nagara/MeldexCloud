<!doctype html>
<html data-standalone-app="note" data-standalone-cloud="note" data-meldex-cloud-app="note" lang="ja" spellcheck="false">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' https: blob:; frame-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' data: blob:; form-action 'self' https://script.google.com">
  <base href="../../">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#181818">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meldex BETA">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="MeldexNote_icon_256.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Meldex Note</title>
  <link rel="icon" href="MeldexNote_icon_64.png" type="image/png">
  <link rel="stylesheet" href="gb-fonts.css">
  <link rel="stylesheet" href="gb-icon-assets.css">
  <link rel="stylesheet" href="gb-theme.css">
  <link rel="stylesheet" href="gb-ui.css">
  <link rel="stylesheet" href="gb-tools.css">
  <link rel="stylesheet" href="gb-note-block-menu.css">
  <link rel="stylesheet" href="gb-note-toolbar-block-select.css">
  <link rel="stylesheet" href="standalone-shell.css">
  <link rel="stylesheet" href="standalone-workspace-tree.css">
  <link rel="stylesheet" href="standalone-mobile-toolbar.css">
  <link rel="stylesheet" href="note-standalone.css">
  <link rel="stylesheet" href="standalone-tags.css">
  <link rel="stylesheet" href="gb-tooltip.css">
  <link rel="stylesheet" href="standalone-profile.css">
</head>
<body>
  <div class="sa-shell sa-options-collapsed note-app">
    <header class="sa-toolbar">
      <div class="sa-menu-wrap">
        <button id="note-menu-button" class="sa-icon-btn" type="button" title="メニュー" aria-label="メニュー" data-e2e-id="note-menu-button"><span class="ico ico-menu"></span></button>
        <div id="note-menu" class="sa-menu" role="menu">
          <button type="button" data-note-action="new" data-e2e-id="note-menu-new"><span class="ico ico-filePlus"></span>新規ノート</button>
          <button type="button" data-note-action="open" data-e2e-id="note-menu-open"><span class="ico ico-folderOpen"></span>開く...</button>
          <button type="button" data-note-action="save" data-e2e-id="note-menu-save"><span class="ico ico-save"></span>保存</button>
          <button type="button" data-note-action="saveAs" data-e2e-id="note-menu-save-as"><span class="ico ico-saveAll"></span>名前を付けて保存...</button>
          <button type="button" data-note-action="workspace" data-cloud-workspace><span class="ico ico-folderOpen"></span>Meldexファイル</button>
          <div class="sa-menu-sep"></div>
          <button type="button" data-note-action="insertLink" data-e2e-id="note-menu-insert-link"><span class="ico ico-link"></span>リンクを挿入</button>
          <button type="button" data-note-action="toggleVertical" data-e2e-id="note-menu-toggle-vertical"><span class="ico ico-kanban"></span>縦書き切替</button>
          <div class="sa-menu-sep"></div>
          <button type="button" data-note-action="exportMarkdown" data-e2e-id="note-menu-export-markdown"><span class="ico ico-fileText"></span>Markdownとして保存...</button>
          <button type="button" data-note-action="exportPng" data-e2e-id="note-menu-export-png"><span class="ico ico-image"></span>画像（PNG）として保存...</button>
          <button type="button" data-note-action="exportDocx" data-e2e-id="note-menu-export-docx"><span class="ico ico-fileText"></span>Word（DOCX）として保存...</button>
          <button type="button" data-note-action="copyMarkdown" data-e2e-id="note-menu-copy-markdown"><span class="ico ico-clipboardCopy"></span>Markdownをコピー</button>
          <div class="sa-menu-sep"></div>
          <button type="button" data-standalone-default-apps-open data-e2e-id="note-menu-default-app"><span class="ico ico-fileCog"></span>既定アプリに設定...</button>
        </div>
      </div>
      <input id="note-title-input" class="note-title-input" type="text" value="無題" aria-label="ノート名" spellcheck="false">
      <div id="note-sync-status" class="sa-sync-status" aria-live="polite"></div>
      <div id="note-path-label" class="sa-path">未保存</div>
      <button id="note-option-panel-button" class="sa-icon-btn" type="button" title="オプションを開く" aria-label="オプションを開く" aria-pressed="false" data-gb-tooltip-key="panel.right.toggle" data-e2e-id="note-option-panel-button"><span class="ico ico-panelRight"></span></button>
    </header>
    <div id="page-rt-toolbar" class="gb-toolbar">
      <button type="button" class="tb-icon-btn" id="btn-toc-toggle" title="目次の表示/非表示" aria-label="目次の表示/非表示" data-e2e-id="note-toc-toggle"><span class="ico ico-panelLeft"></span></button>
      <button type="button" class="tb-icon-btn" id="btn-note-vertical" title="縦書きにする" aria-label="縦書きにする" data-e2e-id="note-vertical-toggle"><span class="ico ico-kanban"></span></button>
      <button type="button" class="tb-icon-btn" id="btn-heading-indent" title="見出しインデント表示" aria-label="見出しインデント表示" data-e2e-id="note-heading-indent-toggle"><span class="ico ico-indentIncrease"></span></button>
      <div class="sep"></div>
      <button type="button" class="tb-icon-btn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す" data-note-rt-cmd="undo" data-e2e-id="note-rt-undo"><span class="ico ico-undo2"></span></button>
      <button type="button" class="tb-icon-btn" title="やり直し (Ctrl+Y)" aria-label="やり直し" data-note-rt-cmd="redo" data-e2e-id="note-rt-redo"><span class="ico ico-redo2"></span></button>
      <div class="sep"></div>
      <button type="button" class="tb-icon-btn" title="太字 (Ctrl+B)" aria-label="太字" data-note-rt-cmd="bold" data-e2e-id="note-rt-bold"><span class="ico ico-bold"></span></button>
      <button type="button" class="tb-icon-btn" title="斜体 (Ctrl+I)" aria-label="斜体" data-note-rt-cmd="italic" data-e2e-id="note-rt-italic"><span class="ico ico-italic"></span></button>
      <button type="button" class="tb-icon-btn" title="下線 (Ctrl+U)" aria-label="下線" data-note-rt-cmd="underline" data-e2e-id="note-rt-underline"><span class="ico ico-underline"></span></button>
      <button type="button" class="tb-icon-btn" title="取り消し線" aria-label="取り消し線" data-note-rt-cmd="strikeThrough" data-e2e-id="note-rt-strike"><span class="ico ico-strikethrough"></span></button>
      <div class="sep"></div>
      <button type="button" id="page-rt-heading-btn" class="note-heading-toolbar-btn" title="行の種類を変更" aria-label="行の種類を変更" aria-haspopup="menu" aria-expanded="false" data-e2e-id="page-rt-heading-btn" data-action="MeldexNoteToolbarBlockSelect.toggle(event)"><span class="note-heading-toolbar-btn-label" data-role="label">行の種類</span><span class="ico ico-chevronDown note-heading-toolbar-btn-caret" aria-hidden="true"></span></button>
      <div class="sep"></div>
      <button type="button" class="tb-icon-btn" title="箇条書き" aria-label="箇条書き" data-note-rt-cmd="insertUnorderedList" data-e2e-id="note-rt-unordered-list"><span class="ico ico-list"></span></button>
      <button type="button" class="tb-icon-btn" title="番号付き" aria-label="番号付き" data-note-rt-cmd="insertOrderedList" data-e2e-id="note-rt-ordered-list"><span class="ico ico-listOrdered"></span></button>
      <button type="button" class="tb-icon-btn" title="引用" aria-label="引用" data-note-rt-cmd="formatBlock:BLOCKQUOTE" data-e2e-id="note-rt-blockquote"><span class="ico ico-textQuote"></span></button>
      <button type="button" class="tb-icon-btn" id="note-rt-callout" title="コールアウト" aria-label="コールアウト" data-e2e-id="note-rt-callout"><span class="ico ico-lightbulb"></span></button>
      <button type="button" class="tb-icon-btn" id="note-rt-table" title="表を挿入" aria-label="表を挿入" data-e2e-id="note-rt-table"><span class="ico ico-table"></span></button>
      <button type="button" class="tb-icon-btn" title="水平線" aria-label="水平線" data-note-rt-cmd="insertHorizontalRule" data-e2e-id="note-rt-horizontal-rule"><span class="ico ico-minus"></span></button>
      <div class="tb-spacer"></div>
      <button type="button" class="tb-icon-btn" id="note-rt-search" title="検索と置換" aria-label="検索と置換" data-e2e-id="note-rt-search"><span class="ico ico-search"></span></button>
    </div>
    <!-- 本体の gb-editor.js が document.getElementById('rt-toolbar') をnullチェック無しで
         参照する箇所があるため（#entity-rt-toolbar 用テンプレートのコピー元。単独版は
         エンティティ編集を持たないため中身は不要）、存在確認クラッシュを避けるための
         空プレースホルダー。可視状態には出ないよう hidden を付ける。
         #entity-freetext も同様（gb-editor.js の setupEditableDropHandler が
         null チェック無しで呼び出す。エンティティ自由記述欄は単独版に無い）。 -->
    <div id="rt-toolbar" hidden></div>
    <div id="entity-freetext" hidden></div>
    <div class="sa-body">
      <main class="sa-main note-main">
        <div class="note-editor-body">
          <div id="note-toc" data-e2e-id="note-toc"></div>
          <div id="note-toc-resize" title="目次幅を調整" role="separator" aria-orientation="vertical" aria-label="目次幅を調整" tabindex="0" data-e2e-id="note-toc-resize"></div>
          <article id="page-content" class="note-editor" contenteditable="true" spellcheck="false" data-path=""></article>
        </div>
        <div id="media-float-controls" class="note-media-controls" role="toolbar" aria-label="メディア操作" aria-hidden="true">
          <button type="button" data-align="left" data-e2e-id="note-media-align-left" title="左寄せ" aria-label="メディアを左寄せ">左</button>
          <button type="button" data-align="center" data-e2e-id="note-media-align-center" title="中央" aria-label="メディアを中央寄せ">中</button>
          <button type="button" data-align="right" data-e2e-id="note-media-align-right" title="右寄せ" aria-label="メディアを右寄せ">右</button>
          <button type="button" data-action="delete" data-e2e-id="note-media-delete" title="削除" aria-label="メディアを削除">削除</button>
        </div>
        <div id="media-resize-handle" class="note-media-resize" data-e2e-id="note-media-resize" aria-hidden="true"></div>
      </main>
      <div id="note-option-resizer" class="sa-option-resizer" role="separator" aria-label="オプションパネルの幅を調整" aria-orientation="vertical" tabindex="0"></div>
      <aside id="note-option-panel" class="sa-option-panel" aria-label="オプションパネル">
        <div class="sa-option-header"><span>オプション</span></div>
        <div id="rp-detail" class="sa-option-body"></div>
      </aside>
    </div>
  </div>

  <div id="file-search-bar">
    <textarea id="fsb-query" aria-label="ファイル内検索" placeholder="検索..." rows="1" style="width:160px;resize:none;"></textarea>
    <span class="fsb-count" id="fsb-count"></span>
    <button type="button" id="fsb-prev" title="前へ" aria-label="前へ">↑</button>
    <button type="button" id="fsb-next" title="次へ" aria-label="次へ">↓</button>
    <textarea id="fsb-replace" aria-label="ファイル内置換" placeholder="置換..." rows="1" style="width:120px;resize:none;"></textarea>
    <button type="button" id="fsb-replace-one" title="置換" aria-label="置換">置換</button>
    <button type="button" id="fsb-replace-all" title="全置換" aria-label="全置換">全置換</button>
    <button type="button" id="fsb-close" title="検索を閉じる" aria-label="検索を閉じる">×</button>
  </div>

  <div id="note-context-menu" class="sa-context-menu" role="menu" aria-hidden="true">
    <button type="button" role="menuitem" data-note-action="save" data-e2e-id="note-context-save">保存</button>
    <button type="button" role="menuitem" data-note-action="insertLink" data-e2e-id="note-context-insert-link">リンクを挿入</button>
    <button type="button" role="menuitem" data-note-command="cut" data-e2e-id="note-context-cut">切り取り</button>
    <button type="button" role="menuitem" data-note-command="copy" data-e2e-id="note-context-copy">コピー</button>
    <button type="button" role="menuitem" data-note-command="selectAll" data-e2e-id="note-context-select-all">すべて選択</button>
  </div>
  <div id="standalone-loading" class="sa-loading" role="status" aria-live="polite" aria-busy="true">
    <div class="sa-loading-box">
      <div class="sa-spinner" aria-hidden="true"></div>
      <div id="standalone-loading-text">読み込んでいます...</div>
    </div>
  </div>
  <div id="standalone-toast" class="sa-toast" role="status" aria-live="polite" data-e2e-id="note-standalone-toast"></div>

<script src="gb-tag-panel-tabs.js"></script><script src="gb-tag-tree-runtime.js"></script><script src="gb-tag-management-overlays.js"></script><script src="gb-tag-catalog-suggestions.js"></script>
