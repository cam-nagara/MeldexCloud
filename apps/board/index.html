<!doctype html>
<html data-standalone-app="board" data-standalone-cloud="board" data-meldex-cloud-app="board" lang="ja" spellcheck="false">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' https: blob:; frame-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' data: blob:; form-action 'self' https://script.google.com">
  <base href="../../">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#181818">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meldex BETA">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="MeldexBoard_icon_256.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Meldex ボード</title>
  <link rel="icon" href="MeldexBoard_icon_64.png" type="image/png">

  <!-- 既存のテーマ・アイコン CSS（本体と共有） -->
  <link rel="stylesheet" href="gb-fonts.css">
  <link rel="stylesheet" href="gb-icon-assets.css">
  <link rel="stylesheet" href="gb-theme.css">

  <!-- レイアウトと汎用 UI（ツールバー横並び等のスタイルがここに含まれる） -->
  <link rel="stylesheet" href="gb-layout.css">
  <link rel="stylesheet" href="gb-ui.css">
  <link rel="stylesheet" href="gb-format-popup.css">

  <!-- ボード関連 CSS（本体と共有。ボードのスタイルは gb-tools.css に統合されている） -->
  <link rel="stylesheet" href="gb-tools.css">

  <!-- exe版の外周シェル -->
  <link rel="stylesheet" href="standalone-workspace-tree.css">
  <link rel="stylesheet" href="standalone-mobile-toolbar.css">
  <link rel="stylesheet" href="board-standalone.css">
  <link rel="stylesheet" href="standalone-profile.css">
</head>
<body>
  <!--
    早期検知: file:// で開いていると、Meldex 内部の分割スクリプト読み込みが
    CORS でブロックされて動かない。HTTP サーバー経由で開く必要があることを案内する。
    window.stop() で後続スクリプトの読み込みを止めてから、画面全体を置き換える。
  -->
  <script>
    (function () {
      if (location.protocol !== 'file:') return;
      try { window.stop(); } catch (e) {}
      var warning = ''
        + '<div style="max-width:560px;margin:60px auto;padding:24px;'
        + 'background:#252525;border:1px solid #3a3a3a;border-radius:8px;'
        + 'color:#e4e4e4;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;line-height:1.7;">'
        + '<h1 style="margin:0 0 12px;font-size:18px;">HTTP サーバー経由で開いてください</h1>'
        + '<p style="margin:0 0 12px;font-size:13px;color:#bbb;">'
        + 'ブラウザの仕様により、ローカルファイル直接（file://）では'
        + 'スクリプトの読み込みに失敗します。'
        + '簡易サーバーを起動してから '
        + '<code style="background:#1a1a1a;padding:2px 6px;border-radius:3px;font-size:12px;">http://localhost:8000/board-standalone.html</code> '
        + 'を開いてください。'
        + '</p>'
        + '<p style="margin:0 0 4px;font-size:12px;color:#888;">PowerShell の場合（app フォルダで実行）:</p>'
        + '<pre style="margin:0 0 12px;padding:10px;background:#1a1a1a;border-radius:4px;font-size:12px;color:#9cdcfe;overflow:auto;">'
        + 'python -m http.server 8000</pre>'
        + '<p style="margin:0 0 4px;font-size:12px;color:#888;">起動後、ブラウザで以下を開きます:</p>'
        + '<pre style="margin:0;padding:10px;background:#1a1a1a;border-radius:4px;font-size:12px;color:#9cdcfe;overflow:auto;">'
        + 'http://localhost:8000/board-standalone.html</pre>'
        + '</div>';
      // documentElement ごと差し替えて、後続の script タグが評価されないようにする。
      document.documentElement.innerHTML = ''
        + '<head><meta charset="utf-8"><title>HTTP サーバーが必要です</title></head>'
        + '<body style="margin:0;background:#1e1e1e;">' + warning + '</body>';
    })();
  </script>
  <div id="board-standalone-shell">
    <!-- メイン領域: ボード描画 ＋ 右サイド（オプション） -->
    <div id="board-main">
      <div id="board-canvas-area">
        <!-- ボード本体の描画先（gb-canvas-root クラスを JS から付与） -->
        <div id="board-canvas-root" class="bsa-hidden"></div>
        <div id="board-loading-overlay" class="bsa-loading-overlay bsa-hidden" role="status" aria-live="polite" aria-busy="true">
          <div class="bsa-loading-box">
            <div class="bsa-loading-spinner" aria-hidden="true"></div>
            <div class="bsa-loading-text">ボードを読み込んでいます...</div>
          </div>
        </div>
        <svg id="ann-overlay" class="bsa-ann-overlay" aria-hidden="true">
          <rect width="100%" height="100%" fill="transparent"></rect>
          <g id="ann-layer"></g>
        </svg>
        <button id="btn-tb-annotation" class="annotation-fab bsa-annotation-fab" type="button" title="注釈 (Alt+A)" data-action="toggleAnnotationToolbar()">
          <span class="ico ico-pencil"></span>
        </button>

        <!-- 互換性エラー時だけ表示する保険。通常起動時はボード本体を最初に表示する。 -->
        <div id="board-start-screen" class="bsa-hidden">
          <div class="bsa-start-card">
            <h1>保存先を選択</h1>
            <p>
              ボードファイル（.mel-board / .board.md / .board.json / .canvas.json）を保存している場所を選んでください。
            </p>
            <button type="button" id="board-pick-folder" class="bsa-btn-primary">フォルダを選ぶ</button>
            <div id="board-compat-notice" class="bsa-hidden">
              お使いのブラウザはフォルダ選択に対応していません。<br>
              Google Chrome、Microsoft Edge、Opera の最新版でお試しください。
            </div>
          </div>
        </div>
      </div>

      <div id="board-sidebar-resizer" class="bsa-sidebar-resizer" role="separator" aria-label="右サイドバーの幅を調整" aria-orientation="vertical" tabindex="0"></div>

      <aside id="board-right-sidebar" aria-label="右サイドバー">
        <section id="board-viewer" class="gb-pane-content" aria-label="ビューワー">
          <div class="bsa-side-header">
            <span>ビューワー</span>
          </div>
          <div id="gb-preview-pane" class="bsa-viewer-pane">
            <div class="bsa-viewer-placeholder">ボード全体を表示します。リンク付きカードを選ぶと内容を確認できます。</div>
          </div>
          <!-- コメント一覧（本体 #rp-annotation と同一のID/構造。gb-right-panel.js の
               loadRpAnnotationList() 等をそのまま利用する。カードの右クリックメニュー
               「コメント一覧を開く」（gb-canvas-features.js、本体と共有）から表示される。 -->
          <div id="rp-annotation" class="bsa-viewer-pane bsa-annotation-pane" hidden style="align-items:stretch;justify-content:flex-start;padding:0;">
            <div style="padding:8px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:4px;">
              <span style="font-size:13px;font-weight:bold;flex:1;">コメント一覧</span>
              <button type="button" title="新規コメント" aria-label="新規コメント" style="font-size:11px;padding:2px 6px;background:var(--bg3);color:var(--fg2);border:1px solid var(--border);border-radius:3px;cursor:pointer;" data-action="newRpComment()"><span class="ico ico-plus" style="width:12px;height:12px;"></span></button>
              <button type="button" title="更新" aria-label="更新" style="font-size:11px;padding:2px 6px;background:var(--bg3);color:var(--fg2);border:1px solid var(--border);border-radius:3px;cursor:pointer;" data-action="loadRpAnnotationList()"><span class="ico ico-refreshCw" style="width:12px;height:12px;"></span></button>
              <button type="button" title="閉じる" aria-label="コメント一覧を閉じる" style="font-size:11px;padding:2px 6px;background:var(--bg3);color:var(--fg2);border:1px solid var(--border);border-radius:3px;cursor:pointer;" data-action="showBoardViewerPreview()"><span class="ico ico-x" style="width:12px;height:12px;"></span></button>
            </div>
            <div style="padding:4px 8px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;gap:4px;flex-wrap:wrap;">
              <input id="rp-ann-search" type="text" aria-label="注釈を検索" placeholder="検索..." style="flex:1;min-width:120px;padding:3px 6px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:3px;font-size:11px;">
              <select id="rp-ann-view" title="表示" aria-label="表示" style="font-size:11px;padding:2px 4px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:3px;"><option value="preview">プレビュー</option><option value="list">リスト</option></select>
              <select id="rp-ann-sort" title="並び替え" aria-label="並び替え" style="font-size:11px;padding:2px 4px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:3px;"><option value="modified-desc">更新が新しい順</option><option value="created-desc">作成が新しい順</option><option value="created-asc">作成が古い順</option><option value="path-asc">ファイル名順</option><option value="type-asc">種類順</option><option value="user-asc">ユーザー順</option></select>
              <select id="rp-ann-type" title="タイプ" aria-label="タイプ" style="font-size:11px;padding:2px 4px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:3px;"><option value="">全タイプ</option><option value="comment">コメント</option><option value="stroke">ストローク</option><option value="marker">マーカー</option><option value="lasso">投げ縄</option><option value="rect">矩形塗り</option><option value="sticky">付箋</option></select>
              <select id="rp-ann-scope" title="対象ファイル" aria-label="対象ファイル" style="font-size:11px;padding:2px 4px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:3px;"><option value="current">現在のファイル</option><option value="all">全ファイル</option></select>
              <select id="rp-ann-status" title="状態" aria-label="状態" style="font-size:11px;padding:2px 4px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:3px;"><option value="open">未解決</option><option value="all">全て</option><option value="resolved">解決済み</option><option value="orphan">孤児</option><option value="deleted">削除済み</option></select>
              <select id="rp-ann-user" title="ユーザー" aria-label="ユーザー" style="font-size:11px;padding:2px 4px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:3px;"><option value="">全ユーザー</option></select>
            </div>
            <div id="rp-ann-list" style="flex:1;overflow-y:auto;padding:8px;"></div>
          </div>
        </section>

        <div id="board-sidebar-splitter" class="bsa-sidebar-splitter" role="separator" aria-label="ビューワーとオプションの高さを調整" aria-orientation="horizontal" tabindex="0"></div>

        <section id="board-options" class="gb-pane-content" aria-label="オプション">
          <div class="bsa-side-header">
            <span>オプション</span>
          </div>
          <div id="rp-detail" class="bsa-options-panel"></div>
        </section>
      </aside>
    </div>
  </div>

  <!-- 画面下のトースト通知 -->
  <div id="board-toast" role="status" aria-live="polite"></div>

  <div id="ann-toolbar" class="floating-toolbar bsa-ann-toolbar" role="toolbar" aria-label="注釈ツール">
    <div class="ft-drag" title="ドラッグで移動">
      <span class="ico ico-gripVertical"></span>
    </div>
    <button class="ann-tool active" type="button" data-tool="pen" title="ペン"><span class="ico ico-pencil"></span></button>
    <label class="ann-width-control" title="ペンの太さ">
      <input type="range" id="ann-width-pen" data-ann-width-tool="pen" min="1" max="16" step="1" value="3">
      <span id="ann-width-pen-label">3</span>
    </label>
    <button class="ann-tool" type="button" data-tool="marker" title="マーカー"><span class="ico ico-highlighter"></span></button>
    <label class="ann-width-control" title="マーカーの太さ">
      <input type="range" id="ann-width-marker" data-ann-width-tool="marker" min="4" max="40" step="1" value="12">
      <span id="ann-width-marker-label">12</span>
    </label>
    <button class="ann-tool" type="button" data-tool="lasso" title="投げ縄塗り"><span class="ico ico-lasso"></span></button>
    <button class="ann-tool" type="button" data-tool="rect" title="矩形塗り"><span class="ico ico-square"></span></button>
    <button class="ann-tool" type="button" data-tool="eraser" title="消しゴム"><span class="ico ico-eraser"></span></button>
    <label class="ann-width-control" title="消しゴムの太さ">
      <input type="range" id="ann-width-eraser" data-ann-width-tool="eraser" min="4" max="48" step="1" value="14">
      <span id="ann-width-eraser-label">14</span>
    </label>
    <div class="bsa-ann-separator"></div>
    <button class="ann-tool" type="button" data-tool="sticky" title="付箋"><span class="ico ico-stickyNote"></span></button>
    <div class="bsa-ann-separator"></div>
    <button type="button" id="ann-color-swatch" class="gb-color-swatch gb-color-swatch--field" title="色" data-color="#c48080"></button>
    <input type="range" id="ann-opacity" min="0" max="1" step="0.05" value="1" title="全体の不透明度">
    <span id="ann-opacity-label">100%</span>
    <div class="bsa-ann-separator"></div>
    <button id="ann-view-lock-btn" class="vl-lock-icon ann-tool" type="button" title="表示ロック（注釈対象ビュー）" aria-label="表示ロック" disabled><span class="ico ico-unlock"></span></button>
    <button id="btn-overlay-toggle" type="button" title="オーバーレイ表示中" class="active" data-action="toggleOverlayVisibility()"><span class="ico ico-eye"></span></button>
    <button type="button" title="全削除" class="bsa-ann-danger" data-action="annClear()"><span class="ico ico-trash2"></span></button>
  </div>

  <!--
    スクリプト読み込み順:
      1) split-loader / 共通基盤
      2) 単独アプリのスタブ（state, GBLayout 等を準備）
      3) ボードエンジン本体（gb-canvas-* / gb-board-*）
      4) 単独アプリのファイルシステム差し替え層（apiFetch 上書き）
      5) 単独アプリのブートストラップ
  -->

  <!-- 1) 共通基盤 -->
  <script src="gb-font-catalog.js"></script>
  <script src="gb-cloud-runtime-config.js"></script>
  <script src="gb-config.js"></script>
  <script src="gb-runtime-adapter.js"></script>
  <script src="gb-resource-url.js"></script>
  <script src="gb-dropbox-auth.js"></script>
  <script src="gb-source-folder-registry.js"></script>
  <script src="gb-workspace-shared-ledger.js"></script>
  <script src="gb-workspace-ledger-io.js"></script>
  <script src="gb-dropbox-folder-picker.js"></script>
  <script src="offline-bundles/gb-storage-adapter.js"></script>
  <script src="offline-bundles/gb-data-access.js"></script>
  <script src="gb-owner-key-store.js"></script>
  <script src="gb-knowledge-signature.js"></script>
  <script src="gb-file-lock-store.js"></script>
  <script src="gb-active-lock-store.js"></script>
  <script src="gb-active-locks.js"></script>
  <script src="offline-bundles/gb-data-access-dropbox-expanded.js"></script>
  <script src="offline-bundles/gb-data-access-dropbox-fileops.js"></script>
  <script src="vendor/lucide-icons.js"></script>
  <script src="offline-bundles/meldex-core.js"></script>
  <script src="gb-path-utils.js"></script>
  <script src="noto-emoji-data.js"></script>
  <script src="vendor/icon-annotations.js"></script>
  <script src="gb-icon-assets.js"></script>
  <script src="gb-dnd.js"></script>
  <script src="gb-ui.js"></script>
  <script src="offline-bundles/gb-tooltip.js"></script>
  <script src="gb-modal-shell.js"></script>
  <script src="gb-dropdown-dismiss.js"></script>
  <script src="offline-bundles/gb-color-palette.js"></script>
  <script src="gb-format-popup.js"></script>
  <script src="gb-export-save.js"></script>
  <script src="gb-export-html.js"></script>
  <script src="gb-events.js"></script>

  <!-- 2) 単独アプリ向けのスタブ（本体の必須グローバルを no-op で用意） -->
  <script src="board-standalone-stubs.js"></script>
  <script src="offline-bundles/gb-detail-panel.js"></script>

  <!-- 3) ボードエンジン本体 -->
  <script src="gb-board-performance.js"></script>
  <script src="gb-board-llm-context.js"></script>
  <script src="offline-bundles/gb-canvas-engine.js"></script>
  <script src="gb-canvas-minimap.js"></script>
  <script src="gb-board-image-drop-mode.js"></script>
  <script src="offline-bundles/gb-canvas-features.js"></script>
  <script src="gb-board-find.js"></script>
  <script src="offline-bundles/gb-canvas-interact.js"></script>
  <script src="gb-board-presets.js"></script>
  <script src="gb-board-links.js"></script>
  <script src="offline-bundles/gb-board-ui.js"></script>
  <script src="gb-board-render-node.js"></script>
  <script src="gb-board-dirty.js"></script>
  <script src="gb-board-background.js"></script>
  <script src="offline-bundles/gb-board-style-manager.js"></script>
  <script src="gb-tool-canvas.js"></script>

  <!-- 4) ローカルフォルダ用の API 差し替え層（apiFetch を上書き） -->
  <script src="board-standalone-fs.js"></script>
  <script src="standalone-default-apps.js"></script>
  <script src="standalone-cloud-path-policy.js"></script>
  <script src="standalone-cloud-edit-session.js"></script>
  <script src="standalone-cloud-runtime.js"></script>
  <script src="standalone-cloud-auth-sync.js"></script>
  <script src="gb-dropbox-profile-sync.js"></script>
  <script src="standalone-profile.js"></script>
  <script src="standalone-workspace-tree.js"></script>
  <script src="gb-annotation-tails.js"></script>
  <script src="offline-bundles/gb-annotations.js"></script>
  <script src="offline-bundles/gb-comment-badges.js"></script>
  <script src="offline-bundles/gb-right-panel.js"></script>
  <script src="standalone-mobile-toolbar.js"></script>

  <!-- 5) 単独アプリのブートストラップ -->
  <script src="board-standalone-app.js"></script>
  <script src="offline-bundles/gb-shortcuts.js"></script>
</body>
</html>
