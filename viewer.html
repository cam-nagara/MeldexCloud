<!DOCTYPE html>
<html lang="ja" spellcheck="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' https: blob:; frame-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob: https:; form-action 'self' https://script.google.com">
<title>Meldex ビューワー</title>
<link rel="icon" href="MeldexViewer_icon_64.png" type="image/png">
<link rel="stylesheet" href="gb-icon-assets.css">
  <link rel="stylesheet" href="gb-shortcut-registry.css">
<!-- 本体と同じ「ダーク」プリセット（--bg 系トークン）。他の単独アプリと同じく最初に読み込む
     （単独アプリのダークモード統一計画 app/docs/standalone-apps-dark-theme-unification-plan-2026-08-13.md）。 -->
<link rel="stylesheet" href="gb-theme.css">
<link rel="stylesheet" href="gb-tooltip.css">
<link rel="stylesheet" href="standalone-secondary-panel.css">
<!-- 共通UIトークン・共通ツールバー・共通コンテキストメニュー（.gb-toolbar / .tb-icon-btn / .gb-context-menu 系） -->
<link rel="stylesheet" href="gb-ui.css">
<link rel="stylesheet" href="gb-tools.css">
<link rel="stylesheet" href="gb-loading-indicators.css">
<link rel="stylesheet" href="viewer.css">
<script src="meldex-cloud-viewer-runtime-01.js?v=8614bab782fffba0"></script>


<script src="gb-cloud-runtime-config.js"></script>
<script src="meldex-cloud-viewer-runtime-02.js?v=37f5a4091fc727cf"></script>




















<!-- PDF.js — Copyright Mozilla Foundation. Licensed under Apache License 2.0: https://github.com/mozilla/pdf.js/blob/master/LICENSE -->
<!-- スタイルは viewer.css へ分割済み（責務分割: app/docs/viewer-stability-common-ui-plan-2026-07-31.md） -->
</head>
<body>
<div class="bg-layer" id="bgA"></div>
<div class="bg-layer" id="bgB"></div>
<div id="display">
  <div class="layer" id="layerA"></div>
  <div class="layer" id="layerB"></div>
  <div id="viewer-loading" class="viewer-loading-state hidden" aria-live="polite">
    <div class="viewer-loading-card" role="status">
      <span class="viewer-loading-spinner" aria-hidden="true"></span>
      <span id="viewer-loading-text">読み込み中...</span>
      <button id="viewer-retry" class="viewer-retry hidden" type="button">再試行</button>
    </div>
  </div>
  <div class="nav-area left" id="nav-prev-area"><span class="ico ico-chevronLeft" aria-hidden="true"></span></div>
  <div class="nav-area right" id="nav-next-area"><span class="ico ico-chevronRight" aria-hidden="true"></span></div>
</div>

<div id="hud">
  <div id="hud-status">ビューワー</div>
  <div id="hud-info"></div>
</div>

<div id="controls" class="gb-toolbar gb-toolbar-viewer">
  <!-- 前後のフォルダのアイコン（skipBack / skipForward）は共通のアイコン置換表に無いため、viewer-controls.js が描画する -->
  <button id="btn-prev-folder" class="tb-icon-btn" title="前のフォルダ (↑)" aria-label="前のフォルダ" data-e2e-id="viewer-prev-folder"></button>
  <button id="btn-prev" class="tb-icon-btn" title="前へ (←)" aria-label="前へ"><span class="ico ico-arrowLeft"></span></button>
  <button id="btn-open-local-file" class="tb-icon-btn" title="画像またはPDFを開く" aria-label="画像またはPDFを開く" hidden><span class="ico ico-folderOpen"></span></button>
  <button id="btn-play" class="tb-icon-btn" title="再生/一時停止 (Space)" aria-label="再生"><span class="ico ico-play"></span></button>
  <button id="btn-next" class="tb-icon-btn" title="次へ (→)" aria-label="次へ"><span class="ico ico-arrowRight"></span></button>
  <button id="btn-next-folder" class="tb-icon-btn" title="次のフォルダ (↓)" aria-label="次のフォルダ" data-e2e-id="viewer-next-folder"></button>
  <input type="range" id="seek-bar" min="0" max="0" value="0" title="シークバー">
  <span id="counter">0 / 0</span>
  <select id="sel-mode" class="tb-select" title="表示モード">
    <option value="single" selected>単体</option>
    <option value="spread">見開き</option>
    <option value="manga">マンガ（右→左）</option>
  </select>
  <button id="btn-zoom-out" class="tb-icon-btn" title="縮小" aria-label="縮小"><span class="ico ico-zoomOut"></span></button>
  <span class="zoom-label" id="zoom-label">100%</span>
  <button id="btn-zoom-in" class="tb-icon-btn" title="拡大" aria-label="拡大"><span class="ico ico-zoomIn"></span></button>
  <button id="btn-fit" class="tb-icon-btn" title="フィット" aria-label="フィット"><span class="ico ico-maximize2"></span></button>
  <button id="btn-flip-h" class="tb-icon-btn" title="左右反転 (M)" aria-label="左右反転"><span class="ico ico-flipHorizontal2"></span></button>
  <button id="btn-flip-v" class="tb-icon-btn" title="上下反転" aria-label="上下反転"><span class="ico ico-flipVertical2"></span></button>
  <button id="btn-rotate" class="tb-icon-btn" title="回転 (Q)" aria-label="回転"><span class="ico ico-rotateCw"></span></button>
  <button id="btn-fullscreen" class="tb-icon-btn" title="全画面 (F)" aria-label="全画面"><span class="ico ico-maximize"></span></button>
  <!-- アノテートのバージョン管理と既定アプリの設定は、下端ツールバーではなく右クリックメニューから開く -->
</div>
<input id="viewer-local-file-input" type="file" accept="image/*,.pdf,application/pdf" multiple hidden>
<!-- 非表示の要素（JS参照用に維持） -->
<input type="range" id="speed" min="0.5" max="15" step="0.5" value="3" style="display:none;">
<span id="speed-label" style="display:none;">3.0s</span>
<button id="btn-shift-back" style="display:none;"></button>
<button id="btn-shift-fwd" style="display:none;"></button>
<button id="btn-bg" style="display:none;"></button>
<button id="btn-hud" style="display:none;"></button>
<button id="btn-original" style="display:none;"></button>

<script src="meldex-cloud-viewer-runtime-03.js?v=bb3ab4807ef59305"></script>





  












<script>
  // 本体のビューワーパネル内（iframe）では出さない。単独ウィンドウのときだけ。
  document.addEventListener("DOMContentLoaded", () => {
    if (window.parent && window.parent !== window) return;
    window.MeldexAlwaysOnTop?.install({
      appId: "viewer",
      host: document.getElementById("controls"),
      buttonClass: "tb-icon-btn",
    });
  });
</script>
<script src="meldex-cloud-viewer-runtime-04.js?v=d9da1a4215fc53d4"></script>






</body>
</html>
