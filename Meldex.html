<script>
(function () {
  function isHardReloadShortcut(event) {
    var key = String(event && event.key || '').toLowerCase();

  }
  function meldexCurrentScopeUrl() {
    try {
      return new URL('./', window.location.href).href;
    } catch (_) {
      return window.location.origin + '/';
    }
  }
  function shouldClearMeldexRegistration(registration) {
    var scope = String(registration && registration.scope || '');
    return !!scope && scope === meldexCurrentScopeUrl();
  }
  function shouldClearMeldexCache(cacheName) {
    return /^meldex(?:-|$)/i.test(String(cacheName || ''));
  }
  function unregisterMeldexServiceWorkers() {
    if (!navigator.serviceWorker || !navigator.serviceWorker.getRegistrations) return Promise.resolve([]);

      .then(function (registrations) {

  }

    if (!window.caches || !caches.keys) return Promise.resolve([]);

        .filter(shouldClearMeldexCache)
        .map(function (key) { return caches.delete(key); }));
    });
  }

    var reload = function () {
      try {
        var url = new URL(window.location.href);
        url.searchParams.set('devBust', String(Date.now()));
        window.location.replace(url.toString());
      } catch (_) {
        window.location.reload();
      }
    };
    var tasks = [];
    try {
      tasks.push(unregisterMeldexServiceWorkers());
    } catch (_) {}
    try {
      tasks.push(clearMeldexCaches());
    } catch (_) {}
    if (!tasks.length) {
      reload();
      return;
    }
    Promise.allSettled(tasks).then(reload).catch(reload);
  }

(async function () {
  window._meldexStartupRestoring = true;
  const bootWatchdog = setTimeout(() => {
    if (typeof _hideStartupSplash === 'function') _hideStartupSplash();
  }, 12000);
  try {
    const launchReady = window.MeldexCloudBootstrap
      ? await window.MeldexCloudBootstrap.prepareLaunch()
      : true;
    if (!launchReady) {
      if (typeof _hideStartupSplash === 'function') _hideStartupSplash();
      window._meldexStartupRestoring = false;
      clearTimeout(bootWatchdog);
      return;
    }
    GBPaneBridge.init();
    if (typeof replaceIcons === 'function') replaceIcons();
    await init();
    if (window.GBSmoke?.enabled) window.GBSmoke.run();
  } catch (error) {
    console.error('[Meldex] boot failed:', error);
    if (typeof _sendLog === 'function') {
      _sendLog('error', {
        message: '[boot-failed] ' + (error?.message || error),
        stack: error?.stack || '',
      });
    }
    if (typeof _hideStartupSplash === 'function') _hideStartupSplash();
  } finally {
    window._meldexStartupRestoring = false;
    clearTimeout(bootWatchdog);
  }
})();
