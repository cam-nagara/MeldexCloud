<script>
(function () {
  function isHardReloadShortcut(event) {
    var key = String(event && event.key || '').toLowerCase();
    return !!(event && !event.altKey && event.shiftKey && (event.ctrlKey || event.metaKey) && (key === 'r' || event.code === 'KeyR'));
  }
  function meldexCurrentScopeUrl() {
    try {
      return new URL('./', window.location.href).href;
    } catch (_) {
      return window.location.origin + '/';
    }
  }
  function shouldClearMeldexRegistration(registration) {
    var scope = String(registration && registration.scope || '');
    return !!scope && scope === meldexCurrentScopeUrl();
  }
  function shouldClearMeldexCache(cacheName) {
    return /^meldex(?:-|$)/i.test(String(cacheName || ''));
  }
  function unregisterMeldexServiceWorkers() {
    if (!navigator.serviceWorker || !navigator.serviceWorker.getRegistrations) return Promise.resolve([]);
    return navigator.serviceWorker.getRegistrations()
      .then(function (registrations) {
        return Promise.all(registrations
          .filter(shouldClearMeldexRegistration)
          .map(function (registration) { return registration.unregister(); }));
      });
  }
  function clearMeldexCaches() {
    if (!window.caches || !caches.keys) return Promise.resolve([]);
    return caches.keys().then(function (keys) {
      return Promise.all(keys
        .filter(shouldClearMeldexCache)
        .map(function (key) { return caches.delete(key); }));
    });
  }
  function performHardReload() {
    var reload = function () {
      try {
        var url = new URL(window.location.href);
        url.searchParams.set('devBust', String(Date.now()));
        window.location.replace(url.toString());
      } catch (_) {
        window.location.reload();
      }
    };
    var tasks = [];
    try {
      tasks.push(unregisterMeldexServiceWorkers());
    } catch (_) {}
    try {
      tasks.push(clearMeldexCaches());
    } catch (_) {}
    if (!tasks.length) {
      reload();
      return;
    }
    Promise.allSettled(tasks).then(reload).catch(reload);
  }
  window.__meldexPerformHardReload = performHardReload;
  document.addEventListener('keydown', function (event) {
    if (event.defaultPrevented || event.isComposing || !isHardReloadShortcut(event)) return;
    event.preventDefault();
    if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
    event.stopPropagation();
    performHardReload();
  }, true);
  try {
    const params = new URLSearchParams(location.search);
    const isDesktop = params.get('desktop') === '1';
    const disablePwa = isDesktop || params.get('pwa') === '0' || params.has('nopwa');
    const isStandalone = window.matchMedia?.('(display-mode: standalone)')?.matches || navigator.standalone === true;
    document.documentElement.dataset.pwaDisplay = isStandalone ? 'standalone' : 'browser';
    if (isDesktop) {
      document.documentElement.dataset.desktopLaunch = '1';
      document.documentElement.style.removeProperty('zoom');
      document.documentElement.style.fontSize = '';
    }
    if (!('serviceWorker' in navigator) || params.has('smoke')) return;
    if (disablePwa) {
      unregisterMeldexServiceWorkers().catch(() => {});
      clearMeldexCaches().catch(() => {});
      return;
    }
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
      .then((registration) => registration.update?.())
      .catch(() => {});
  } catch (e) {}
})();
</script>

<script>
(async function () {
  window._meldexStartupRestoring = true;
  const bootWatchdog = setTimeout(() => {
    if (typeof _hideStartupSplash === 'function') _hideStartupSplash();
  }, 12000);
  try {
    // デスクトップ付箋の小窓は付箋1枚だけを描画する。フォルダツリー・ワークスペース・
    // 前回の表示復元まで走らせると、付箋の数だけ本体の起動処理が重複して起動が詰まる。
    if (typeof _isTrayAnnotationHost === 'function' && _isTrayAnnotationHost()) {
      if (typeof _hideStartupSplash === 'function') _hideStartupSplash();
      window._meldexStartupRestoring = false;
      clearTimeout(bootWatchdog);
      return;
    }
    const launchReady = window.MeldexCloudBootstrap
      ? await window.MeldexCloudBootstrap.prepareLaunch()
      : true;
    if (!launchReady) {
      if (typeof _hideStartupSplash === 'function') _hideStartupSplash();
      window._meldexStartupRestoring = false;
      clearTimeout(bootWatchdog);
      return;
    }
    GBPaneBridge.init();
    if (typeof replaceIcons === 'function') replaceIcons();
    await init();
    await window.MeldexSurfaceDeepLink?.applyFromLocation();
    if (window.GBSmoke?.enabled) window.GBSmoke.run();
  } catch (error) {
    console.error('[Meldex] boot failed:', error);
    if (typeof _sendLog === 'function') {
      _sendLog('error', {
        message: '[boot-failed] ' + (error?.message || error),
        stack: error?.stack || '',
      });
    }
    if (typeof _hideStartupSplash === 'function') _hideStartupSplash();
  } finally {
    window._meldexStartupRestoring = false;
    clearTimeout(bootWatchdog);
  }
})();
</script>
